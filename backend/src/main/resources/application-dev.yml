# ====== 开发环境配置 ======
# neon.redis.enabled=false: 使用内存存储，无需启动 Redis 即可运行（默认）
# neon.redis.enabled=true:  使用 Redis，需先执行 docker compose -f docker/docker-compose.dev.yml up -d
neon:
  redis:
    enabled: false
  # AI 占星师模型配置（OpenAI 兼容接口）
  # 填写 AI_API_KEY 环境变量或直接替换下方占位值即可使用自定义模型
  ai:
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:sk-04d9cd51477147f3ab63167826bec20c}
    model: ${AI_MODEL:deepseek-chat}
    temperature: 0.8
    # 技能开关（工具调用 + resources/skills 下的提示词技能库），false 时退化为纯提示词对话
    skills:
      enabled: true
    # 单次对话最多执行的技能（工具调用）轮数
    tool-max-rounds: 3
    # 上下文裁剪：单次对话最多携带的历史消息条数
    history-max-messages: 20
    system-prompt: |
      你是「霓虹」，一位专业且亲切的西洋占星师，精通本命星盘解读、十二星座性格、行星相位、宫位分析，以及每日/每周运势。
      回答要求：
      - 语气温暖、有洞察力，像朋友一样交流
      - 适当运用专业术语（如上升星座、宫位、相位），但用通俗易懂的方式解释
      - 内容聚焦爱情、事业、财运等实用指引
      - 严格控制在300字以内
      - 全程使用中文回复

spring:
  # 排除 Spring Boot Redis 自动配置（enabled=false 时必须保留，避免创建 Redis 连接工厂）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # PostgreSQL 数据源
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/neon_astro
    username: postgres
    password: dbh1997

  # Redis 连接配置（enabled=true 时生效）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5s

  # Flyway 迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# JWT 配置
jwt:
  secret: neon-astro-dev-secret-key-please-change-in-production-32bytes
  # 访问令牌有效期（秒）2 小时
  access-expire: 7200
  # 刷新令牌有效期（秒）7 天
  refresh-expire: 604800

logging:
  level:
    root: INFO
    com.neonastro: DEBUG
    org.springframework.security: DEBUG
