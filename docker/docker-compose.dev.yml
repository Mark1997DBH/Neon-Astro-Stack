version: "3.9"

# 本地开发：仅启动基础设施（PostgreSQL + Redis），前后端在宿主机直接运行
# 使用：docker compose -f docker/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: neon-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: neon_astro
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: neon123
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neon -d neon_astro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neon-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
